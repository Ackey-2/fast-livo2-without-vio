common:
  lid_topic: "/scan"
  imu_topic: "/IMU"
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.5, 0, 0.45]
  extrinsic_R: [1, 0, 0,
               0,  1, 0,
               0,  0, 1]

time_offset:
  lidar_time_offset: 0
  imu_time_offset: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 7 # Ouster
  scan_line: 16
  blind: 2

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 1.5 # 1.5
  gyr_cov: 0.15 # 1.5
  b_acc_cov: 0.01 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.01
  min_eigen_value: 0.0025 # 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false      # LRU 替代 sliding
  max_voxel_count: 10000     # 最大体素数量
  max_memory_mb: 800         # 最大内存 MB

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "eee_01"
  pose_output_en: true
  
pcd_save:
  pcd_save_en: false
  filter_size_pcd: 0.1
  interval: 200
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.